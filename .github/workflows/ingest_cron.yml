name: Vicarius Scheduled Ingestion & Check

on:
  schedule:
    # Runs every 3 hours (at 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  trigger-ingestion:
    name: Poll Gmail and Classroom
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Ingestion Endpoint
        run: |
          echo "Triggering Vicarius Ingestion pipeline..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${{ secrets.VERCEL_DEPLOYED_URL }}/api/ingest" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET_TOKEN }}")
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          
          echo "Response Body: $BODY"
          echo "HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
            echo "Error: Ingestion endpoint returned status $HTTP_STATUS"
            exit 1
          fi
