name: Morning Deadline Briefing

on:
  schedule:
    # 02:30 UTC is 08:00 IST
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Morning Briefing
        run: |
          echo "Triggering Vicarius Morning Briefing..."
          TARGET_URL="${{ secrets.NEXT_PUBLIC_SITE_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://your-deployment-domain.vercel.app"
          fi
          TOKEN="${{ secrets.CRON_SECRET }}"
          if [ -z "$TOKEN" ]; then
            echo "Error: CRON_SECRET is not configured in repository secrets."
            exit 1
          fi
          curl -X GET "${TARGET_URL}/api/briefing" \
               -H "Authorization: Bearer ${TOKEN}" \
               -f -s
